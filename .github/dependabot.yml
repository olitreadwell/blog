version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check allows typescript ^5 || ^6 and typescript-eslint allows
      # <6.1.0, so a TypeScript major bump breaks `npm ci` with ERESOLVE.
      # Revisit when both raise their peer range.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
